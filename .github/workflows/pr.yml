name: PR checks

# On pull requests: typecheck and run the full test suite with coverage.
# The whole suite runs in a few seconds, and running it all (rather than
# `vitest --changed`) also catches changes outside the JS module graph —
# e.g. migrations.test.ts reads src-tauri/src/lib.rs from disk.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the deploy target; Linux is the fast baseline.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        # Fails if coverage drops below the thresholds in vite.config.ts.
        run: npm run test:ci

      - name: Coverage summary
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: node scripts/coverage-summary.cjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
